name: Update Fidaro contact email

on:
  push:
    paths:
      - '.github/workflows/fix-fidaro-email.yml'

permissions:
  contents: write

jobs:
  update-email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Update email
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('mailto:contact@fidaro.com', 'mailto:info@fidaro.com.au')
          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Update Fidaro contact email'
          git push
